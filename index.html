<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обслуживание сайта приостановлено</title>
  <meta name="theme-color" content="#f6f6f6">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f6f6f6;
      color: #202020;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(calc(100% - 3rem), 52rem);
      padding-block: 4rem;
    }
    h1 {
      margin: 0 0 1.5rem;
      max-width: 20ch;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 750;
      line-height: 1.15;
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }
    p {
      margin: 0;
      max-width: 54ch;
      color: #454545;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main aria-labelledby="notice-title">
    <h1 id="notice-title">ОБСЛУЖИВАНИЕ САЙТА ПРИОСТАНОВЛЕНО</h1>
    <p>По заявлению разработчиков — Шамса и Далера — выполненные работы по сайту остаются неоплаченными: владелец должен разработчикам почти $3&nbsp;000.</p>
    <p style="margin-top:1rem;color:#6b6b6b;font-size:.9em;">Сайт будет восстановлен после полного урегулирования оплаты.</p>
  </main>
</body>
</html>
