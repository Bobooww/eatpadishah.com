name: InKind removal guard
# inKind is disabled for eatpadishah.com at the owner's request.
# This read-only check prevents the loader from being reintroduced.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkind-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify inKind is absent from published assets
        shell: python
        run: |
          from pathlib import Path

          suffixes = {'.html', '.js', '.txt', '.json', '.css'}
          assets = [
              path for path in Path('.').rglob('*')
              if path.is_file()
              and path.suffix in suffixes
              and '.git' not in path.parts
              and '.github' not in path.parts
          ]
          failures = [
              str(path) for path in assets
              if b'inkindscript.com' in path.read_bytes().lower()
          ]
          if failures:
              raise SystemExit('inKind is disabled; remove its loader from: ' + ', '.join(failures))
          print(f'Checked {len(assets)} published assets: no inKind loader.')
